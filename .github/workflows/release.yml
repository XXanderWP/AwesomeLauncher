name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Check release version
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.release_config.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Configure release metadata
        id: release_config
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "tag_name=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_pattern=^v${VERSION}$" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          TAG_PATTERN="${{ steps.release_config.outputs.tag_pattern }}"
          MATCH_COUNT=$(gh release list --repo "$REPO" --json tagName \
            --jq "[.[] | select(.tagName | test(\"${TAG_PATTERN}\"))] | length")
          if [ "$MATCH_COUNT" -gt 0 ]; then
            echo "Release ${{ steps.release_config.outputs.tag_name }} already exists, skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for ${{ steps.release_config.outputs.tag_name }}, build required."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    if: needs.prepare.outputs.should_build == 'true'
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            electron_builder_target: --win
          - platform: linux
            os: ubuntu-latest
            electron_builder_target: --linux
          - platform: macos
            os: macos-latest
            electron_builder_target: --mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/main
        run: npm run build

      - name: Package for ${{ matrix.platform }}
        run: npx electron-builder ${{ matrix.electron_builder_target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.should_build == 'true'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: dist-*
          merge-multiple: true

      - name: Write release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cat > release-notes.md <<EOF
          ## English

          Download the file for your operating system:

          | File | Platform |
          |------|----------|
          | \`AwesomeCraftLauncher-setup-${VERSION}.exe\` | Windows (installer) |
          | \`AwesomeCraftLauncher-setup-${VERSION}.AppImage\` | Linux |
          | \`AwesomeCraftLauncher-setup-${VERSION}-arm64.dmg\` | macOS (Apple Silicon) |
          | \`AwesomeCraftLauncher-setup-${VERSION}-x64.dmg\` | macOS (Intel) |

          macOS users: open \`QUARANTINE-README.txt\` inside the DMG for Gatekeeper removal instructions.
          Auto-update also publishes \`.zip\` builds for Apple Silicon / Intel; install manually from the DMG.

          ## Русский

          Скачайте файл для вашей операционной системы:

          | Файл | Платформа |
          |------|-----------|
          | \`AwesomeCraftLauncher-setup-${VERSION}.exe\` | Windows (установщик) |
          | \`AwesomeCraftLauncher-setup-${VERSION}.AppImage\` | Linux |
          | \`AwesomeCraftLauncher-setup-${VERSION}-arm64.dmg\` | macOS (Apple Silicon) |
          | \`AwesomeCraftLauncher-setup-${VERSION}-x64.dmg\` | macOS (Intel) |

          Для macOS откройте \`QUARANTINE-README.txt\` в DMG — там команда снятия карантина.
          Для автообновления в релизе также публикуются \`.zip\` (их скачивать вручную не нужно).

          ## Українська

          Завантажте файл для вашої операційної системи:

          | Файл | Платформа |
          |------|-----------|
          | \`AwesomeCraftLauncher-setup-${VERSION}.exe\` | Windows (інсталятор) |
          | \`AwesomeCraftLauncher-setup-${VERSION}.AppImage\` | Linux |
          | \`AwesomeCraftLauncher-setup-${VERSION}-arm64.dmg\` | macOS (Apple Silicon) |
          | \`AwesomeCraftLauncher-setup-${VERSION}-x64.dmg\` | macOS (Intel) |

          Для macOS відкрийте \`QUARANTINE-README.txt\` у DMG — там команда зняття карантину.
          Для автооновлення в релізі також публікуються \`.zip\` (їх не потрібно завантажувати вручну).
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: AwesomeCraftLauncher v${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          files: release-assets/*

  cleanup-artifacts:
    name: Clean up build artifacts
    needs: [prepare, release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete distribution artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: dist-*
          failOnError: false

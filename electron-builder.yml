appId: ru.awesomecraft.launcher
productName: AwesomeCraftLauncher
artifactName: ${productName}-setup-${version}.${ext}
copyright: Copyright © 2026 AwesomeCraft

asar: true
compression: maximum

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!docs/*'
  - '!skills/*'
  - '!AGENT.md'
  - '!.github/*'
  - '!{.eslintignore,.eslintrc*,eslint.config.*,.prettier*,tsconfig*,electron.vite.config.*}'
  - '!{dev-app-update.yml,.nvmrc,.npmrc}'
  - '!{README.md,README.*.md}'

extraResources:
  - from: resources/libraries
    to: libraries
  - from: resources/mac
    to: mac
    filter:
      - '**/*'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    # DMG for manual install; ZIP required by electron-updater (Squirrel.Mac).
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${productName}-setup-${version}-${arch}.${ext}
  category: public.app-category.games
  icon: build/icon.png
  darkModeSupport: true

dmg:
  title: AwesomeCraftLauncher ${version}
  iconSize: 96
  # Keep primary icons high; quarantine note lower.
  # Dotfiles (.background / .VolumeIcon) stay system-hidden; taller window pushes them down if revealed.
  window:
    width: 680
    height: 520
  contents:
    - x: 160
      y: 140
    - x: 520
      y: 140
      type: link
      path: /Applications
    - x: 340
      y: 380
      type: file
      path: resources/mac/QUARANTINE-README.txt
      name: How to remove quarantine.txt

linux:
  target:
    - AppImage
  category: Game
  synopsis: AwesomeCraft Minecraft Launcher
  description: Custom launcher for AwesomeCraft Minecraft servers.
  icon: build/icon.png
  maintainer: AwesomeCraft

directories:
  buildResources: build
  output: dist

publish:
  provider: github
  owner: XXanderWP
  repo: AwesomeLauncher

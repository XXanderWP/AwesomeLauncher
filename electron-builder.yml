appId: ru.awesomecraft.launcher
productName: AwesomeCraftLauncher
# Stable download names (version is in the GitHub release tag, not the filename).
artifactName: AwesomeLauncher.${ext}
copyright: Copyright © 2026 AwesomeCraft

asar: true
# Prefer faster unpack over smallest download — AppImage mount + asar I/O benefit.
compression: normal

protocols:
  - name: AwesomeCraft Launcher
    schemes:
      - awesomelauncher

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!docs/*'
  - '!skills/*'
  - '!AGENT.md'
  - '!.github/*'
  - '!{.eslintignore,.eslintrc*,eslint.config.*,.prettier*,tsconfig*,electron.vite.config.*}'
  - '!{dev-app-update.yml,.nvmrc,.npmrc}'
  - '!{README.md,README.*.md}'

extraResources:
  - from: resources/libraries
    to: libraries
  - from: resources/mac
    to: mac
    filter:
      - '**/*'
  - from: build/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    # Unsigned builds cannot use Squirrel.Mac auto-update. Ship DMG only;
    # the launcher installs updates manually via privileged osascript.
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: AwesomeLauncher-${arch}.${ext}
  category: public.app-category.games
  icon: build/icon.png
  darkModeSupport: true

dmg:
  title: AwesomeCraftLauncher ${version}
  iconSize: 96
  # Keep primary icons high; quarantine note lower.
  # Dotfiles (.background / .VolumeIcon) stay system-hidden; taller window pushes them down if revealed.
  window:
    width: 680
    height: 520
  contents:
    - x: 160
      y: 140
    - x: 520
      y: 140
      type: link
      path: /Applications
    - x: 340
      y: 380
      type: file
      path: resources/mac/QUARANTINE-README.txt
      name: How to remove quarantine.txt

linux:
  target:
    - AppImage
  category: Game
  synopsis: AwesomeCraft Minecraft Launcher
  description: Custom launcher for AwesomeCraft Minecraft servers.
  icon: build/icon.png
  maintainer: AwesomeCraft

# zstd mounts much faster than xz/maximum; keeps a single portable AppImage for all distros.
appImage:
  compression: zstd

directories:
  buildResources: build
  output: dist

publish:
  provider: github
  owner: XXanderWP
  repo: AwesomeLauncher
